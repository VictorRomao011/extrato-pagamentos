<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#120C07">
  <meta name="description" content="Controle de Vale, Adiantamento e Pagamento — Adega da Naty.">
  <link rel="canonical" href="https://victorromao011.github.io/extrato-pagamentos/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Controle de Vale e Pagamentos — Adega da Naty">
  <meta property="og:description" content="Registre vales, adiantamentos e pagamentos mês a mês, veja o saldo a pagar e gere o PDF do relatório.">
  <meta property="og:url" content="https://victorromao011.github.io/extrato-pagamentos/">
  <meta property="og:locale" content="pt_BR">
  <title>Controle de Vale e Pagamentos — Adega da Naty</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- ===================== CABEÇALHO ===================== -->
  <header class="topo">
    <div class="container topo__inner">
      <div class="topo__marca">
        <h1>Controle de <em>Vale e Pagamentos</em></h1>
        <p>Gestão de Folha</p>
      </div>
      <div class="topo__data">
        Relatório gerado em
        <strong id="dataRelatorio">—</strong>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ===================== FUNCIONÁRIO + RESUMO ===================== -->
    <div class="painel">
      <div class="func-card" id="func"><!-- render JS --></div>
      <div class="resumo" id="resumo"><!-- render JS --></div>
    </div>

    <!-- título só no PDF -->
    <p class="print-only" style="margin:14px 0 6px; font-weight:600; color:#9c7a1e; letter-spacing:.1em; text-transform:uppercase; font-size:11px;">
      Controle mensal — Junho a Dezembro de 2026
    </p>

    <!-- ===================== MESES (accordion) ===================== -->
    <div class="meses" id="meses"><!-- render JS --></div>

    <p class="rodape-nota">
      Adega da Naty · Rua Lima, 365 — Vila Joana, Jundiaí/SP
      <span class="aviso">Os dados ficam salvos apenas neste navegador/dispositivo. Use “Salvar Dados” e “Gerar PDF” para guardar uma cópia.</span>
    </p>
  </main>

  <!-- ===================== BARRA DE AÇÕES ===================== -->
  <div class="acoes">
    <div class="acoes__inner">
      <button class="btn btn--contorno btn--ghost no-print" id="btnLimpar" type="button" title="Apagar tudo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
        <span class="txt-longo">Limpar</span>
      </button>
      <button class="btn btn--contorno" id="btnSalvar" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
        <span class="txt-longo">Salvar Dados</span><span class="txt-curto">Salvar</span>
      </button>
      <button class="btn btn--ouro" id="btnPDF" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 18h4"/></svg>
        <span class="txt-longo">Gerar PDF</span><span class="txt-curto">PDF</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
